<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoShareX — Email Confirmed</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background:
        radial-gradient(circle at top, rgba(96, 165, 250, 0.12), transparent 34%),
        linear-gradient(180deg, #ffffff 0%, #f8fbff 100%);
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      max-width: 420px;
      width: 100%;
      text-align: center;
      background: #ffffff;
      border: 1px solid #dbeafe;
      border-radius: 20px;
      padding: 44px 32px;
      box-shadow: 0 12px 32px rgba(15, 23, 42, 0.06);
    }

    .check {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(180deg, #2dd4bf 0%, #2563eb 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .check svg {
      width: 30px;
      height: 30px;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }

    .logo span {
      color: #2563eb;
    }

    h1 {
      font-size: 20px;
      font-weight: 800;
      margin: 12px 0 8px;
    }

    p {
      font-size: 14.5px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(180deg, #2dd4bf 0%, #2563eb 100%);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 13px 28px;
      border-radius: 999px;
    }

    .hint {
      margin-top: 18px;
      font-size: 12.5px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <div class="logo">Go<span>Share</span>X</div>
    <h1>Email confirmed</h1>
    <p>Your email address has been verified. You can now go back to the GoShareX app and log in.</p>
    <a class="btn" href="gosharex://auth-callback">Open GoShareX</a>
    <div class="hint">If the app doesn't open automatically, switch to it from your recent apps and sign in.</div>
  </div>
</body>

</html>
